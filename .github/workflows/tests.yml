name: Windows stability tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
      - name: Build application and integration tests
        shell: msys2 {0}
        run: |
          make CXX=g++ WINDRES=windres CXXFLAGS='-std=c++17 -O2 -Wall -Wextra -Werror -Iinclude -DUNICODE -D_UNICODE -D_WIN32_WINNT=0x0601 -MMD -MP'
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -DUNICODE -D_UNICODE -D_WIN32_WINNT=0x0601 -Iinclude tests/copier_tests.cpp src/Copier.cpp -o bin/copier_tests.exe -static -lshell32 -lole32 -luuid
      - name: Run integration tests
        shell: msys2 {0}
        run: ./bin/copier_tests.exe
